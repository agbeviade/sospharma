name: Sync On-Duty Pharmacies

on:
  schedule:
    # Chaque jour à 01:00 UTC (01:00 Abidjan — UTC+0)
    - cron: '0 1 * * *'
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-pharmacies Edge Function
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "https://wtcgfcqeoxyrxtdnfkqz.supabase.co/functions/v1/sync-pharmacies")

          echo "HTTP status: $RESPONSE"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Sync échoué (status $RESPONSE)"
            exit 1
          fi

          OK=$(python3 -c "import sys,json; d=json.load(open('/tmp/response.json')); print(d.get('ok',False))")
          if [ "$OK" != "True" ]; then
            echo "Sync retourné ok=false"
            exit 1
          fi

          echo "Sync OK !"
